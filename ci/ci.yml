name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test on the fixture pack
        run: |
          python -m skill_lint check fixtures/skills fixtures/skills-user --fail-on never
          python -m skill_lint budget fixtures/skills fixtures/skills-user --budget-chars 700
          python -m skill_lint collisions fixtures/skills fixtures/skills-user

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the composite action on the clean fixtures
        uses: ./
        with:
          path: examples/good-skills
          fail-on: warning
