[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-skill-lint"
version = "1.0.0"
description = "Linter for Claude Code SKILL.md packs: frontmatter, trigger quality, skill-listing budget truncation, trigger collisions, dead links, leaked secrets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Waseem Nasir" }]
keywords = ["claude", "claude-code", "skills", "SKILL.md", "linter", "agent-skills", "anthropic"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
claude-skill-lint = "skill_lint.cli:main"

[project.urls]
Homepage = "https://github.com/waseemnasir2k26/claude-skill-lint"

[tool.setuptools]
packages = ["skill_lint", "skill_lint.rules", "skill_lint.report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
